<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHA Lab · Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#080a0f;--panel:#10131a;--panel2:#151923;--line:#252b38;--text:#f4f5f7;--muted:#a8afbd;--accent:#b9a3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:35px 22px}h1{margin:0 0 6px}.muted{color:var(--muted)}button{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#111;border-color:var(--accent)}input{padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);width:100%;margin:6px 0 10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stat{padding:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.num{font-size:28px;font-weight:800}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.hidden{display:none}.error{color:#fb7185}.login{max-width:430px;margin:80px auto}</style></head><body><main class="wrap"><section id="login" class="login panel"><h1>Admin dashboard</h1><p class="muted">Sign in with the admin account configured for this project.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="loginBtn">Sign in</button><p id="loginError" class="error"></p></section><section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1>GHA Lab Analytics</h1><p class="muted">Private usage dashboard · last <span id="daysLabel">30</span> days</p></div><div><select id="days" style="padding:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px"><option>7</option><option selected>30</option><option>90</option></select> <button id="logout">Sign out</button></div></div><div class="grid" id="stats"></div><div class="panel"><h2>Daily usage</h2><div id="daily"></div></div><div class="panel"><h2>Lesson usage</h2><div id="lessons"></div></div><div class="panel"><h2>Named visitors</h2><p class="muted">Names appear only when visitors voluntarily provide one.</p><div id="visitors"></div></div></section></main><script>const U='https://tcenymmcidmtetggannf.supabase.co',K='sb_publishable_FkHcl40cIeBnNoyg5Nu5gg_p4Cad3wg',API=U+'/functions/v1/analytics',sb=window.supabase.createClient(U,K),$=id=>document.getElementById(id);async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');const days=$('days').value;$('daysLabel').textContent=days;const r=await fetch(API+'?days='+days,{headers:{Authorization:'Bearer '+session.access_token}}),x=await r.json();if(!r.ok)throw new Error(x.error||'Could not load dashboard');$('stats').innerHTML=Object.entries(x.summary).map(([k,v])=>'<div class="stat"><div class="muted">'+k.replaceAll('_',' ')+'</div><div class="num">'+v+'</div></div>').join('');$('daily').innerHTML='<div class="row"><b>Date</b><b>Views</b><b>Sessions</b><b>Challenges</b></div>'+x.daily.map(d=>'<div class="row"><span>'+d.day+'</span><span>'+d.page_views+'</span><span>'+d.unique_sessions+'</span><span>'+d.challenge_attempts+'</span></div>').join('');const es=Object.entries(x.lessons);$('lessons').innerHTML='<div class="row"><b>Lesson</b><b>Starts</b><b>Completions</b><b>Completion rate</b></div>'+es.map(([s,v])=>'<div class="row"><span>'+s+'</span><span>'+v.starts+'</span><span>'+v.completions+'</span><span>'+(v.starts?Math.round(v.completions/v.starts*100):0)+'%</span></div>').join('');$('visitors').innerHTML=x.visitors.length?'<div class="row"><b>Name</b><b>Sessions</b><b>Last seen</b><b></b></div>'+x.visitors.map(v=>'<div class="row"><span>'+esc(v.name)+'</span><span>'+v.sessions+'</span><span>'+new Date(v.last_seen).toLocaleString()+'</span><span></span></div>').join(''):'<p class="muted">No visitors have opted to share a name yet.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;return}load().catch(e=>$('loginError').textContent=e.message)};$('logout').onclick=()=>sb.auth.signOut().then(load);$('days').onchange=()=>load().catch(e=>alert(e.message));load().catch(e=>$('loginError').textContent=e.message);</script></body></html>
